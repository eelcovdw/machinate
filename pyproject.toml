[project]
name = "machinate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eelco van der Wel", email = "eelcovdw@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "rich>=14.3.2",
    "tomli-w>=1.2.0",
    "typer>=0.23.1",
]

[project.scripts]
machinate = "machinate.cli:app"
machi = "machinate.cli:app"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    "prek>=0.3.2",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "G004",   # f-string in comment
    "COM812", # missing-trailing-comma
    "CPY001", # Missing copyright notice at top of file
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D203",   # blank line required before class docstring
    "D211",   # no-blank-line-before-class
    "D213",   # multi-line-summary-second-line
    "EM101",  # raw-string-in-exception
    "FIX002", # line-contains-todo
    "ISC001", # Conflicts with formatter ruff
    "TD003",  # missing-todo-link
    "TRY003", # raise-vanilla-args
    "D",      # Missing docstring in public endpoint
    "TC",     # flake-8 type checking
]

[tool.ruff.lint.per-file-ignores]
"src/machinate/cli/*.py" = [
    "FBT",     # Boolean positional args are fine for typer CLI flags
]
"tests/*.py" = [
    "INP001",  # implicit namespace package
    "S101",    # asserts allowed in tests
    "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant
    "FBT",     # Don't care about booleans as positional arguments in tests
    "PLR2004", # Magic value used in comparison
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "SLF001",  # Private member access allowed in tests
]

[tool.basedpyright]
reportUnusedCallResult = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
